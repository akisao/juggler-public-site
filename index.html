<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- CSP: このサイト自身のファイル以外は読み込ませず、ページに直接書いたスクリプト・見た目の指定も動かさない。
     知らない人にも公開するので、万一どこかに穴があっても見る人の端末で外の命令が動かないように（2026-10-11 アキラさん）。
     ほかの <meta>・<link> より前に置く（後ろに置くと、それより前に読んだものには効かない）。notes.html と同じ内容にそろえる。
     style 属性も止まるので、app.js は色を HTML に書かず要素に直接付けている（paintCell） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ホーム画面・デスクトップに「アプリ」として置けるように（2026-09-27 アキラさんの要望）。
     アイコンを描き直したら ?v= も変える。同じURLだと iPhone が古い絵を使い続けた（2026-09-27） -->
<link rel="manifest" href="manifest.webmanifest?v=20260927peka">
<link rel="icon" href="icons/favicon.ico?v=20260927peka">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=20260927peka">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ペカジャグ">
<meta name="theme-color" content="#2b2b2b">
<title>ペカジャグ観測所</title>
<meta name="description" content="苫小牧のホールのジャグラーについて、REG・合算の実測がメーカー公表値の設定1〜6のどこに位置するかを店ごとに並べています。">
<!-- ?v= は画面のファイルを変えたら書き換える。スマホが古い app.js を使い続けないように（2026-09-25） -->
<link rel="stylesheet" href="style.css?v=20261014a">
</head>
<body>
<button id="sticky" class="sticky" hidden aria-label="表示中の条件（タップで上へ）"><span id="stickyText"></span></button>
<header class="top">
  <h1>ペカジャグ観測所 <small>苫小牧</small></h1>
  <p class="lead">実測を公表値の目盛りに置いただけ。右にあるほど設定を使っている可能性が高い。<a href="notes.html">数字の出し方</a></p>
  <!-- 説明文の中の小さなリンクでは気づかれなかった（10/14 アキラさん「わかりづらい」）。タイトルのすぐ下に大きく置く -->
  <a class="simlink" href="sim.html">
    <span class="simlink-ic" aria-hidden="true">¥</span>
    <span class="simlink-tx"><b>期待収支シミュレーター</b><small>この台を打っていたら、平均でいくらだったか</small></span>
    <span class="simlink-go" aria-hidden="true">›</span>
  </a>
</header>
<main id="app">
  <nav class="seg" id="period" aria-label="期間">
    <button data-v="day" class="on">日</button>
    <button data-v="month">月</button>
    <button data-v="total">累計</button>
  </nav>
  <div class="datenav">
    <button id="prev" aria-label="前へ">◀</button>
    <span id="range"></span>
    <button id="next" aria-label="次へ">▶</button>
  </div>
  <div id="split" hidden>
    <nav class="seg small" aria-label="日の種類">
      <button data-v="all" class="on">全日</button>
      <button data-v="special">特定日</button>
      <button data-v="normal">平常日</button>
    </nav>
    <nav class="seg small" aria-label="曜日">
      <button data-v="weekday">平日</button>
      <button data-v="sat">土曜</button>
      <button data-v="sun">日曜</button>
      <button data-v="holiday">祝日</button>
    </nav>
    <p class="hint">タップで表示／非表示。いくつでも色分けして重なります</p>
  </div>
  <nav class="tabs" id="machines" aria-label="機種"></nav>
  <p class="legend"><span id="dotLabel">● 実測</span>　<span id="cmpLegend">▽ <span id="cmpLabel">この店の累計</span>　</span><a href="notes.html#scale">?</a></p>
  <section id="rows"></section>
  <p class="foot">最終更新 <span id="updated"></span> ／ 台ごとの数値は「台ごとトップ10」だけ。<a href="notes.html">注記</a></p>
</main>
<script src="app.js?v=20261011a"></script>
</body>
</html>
